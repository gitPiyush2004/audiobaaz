<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiobaaz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0F0F0F;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  @keyframes vinylSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #vinyl-group {
    transform-box: fill-box;
    transform-origin: center;
    animation: vinylSpin 6s linear infinite;
    animation-play-state: paused;
  }

  @keyframes pulse {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    60%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .arr-base {
    fill: none;
    stroke: #2e2e2e;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .arr-glow {
    fill: none;
    stroke: #E8FF4D;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(232,255,77,0.9));
    opacity: 0;
  }
  .arr-glow.pulsing {
    animation: pulse 4s ease-in-out infinite;
  }
  #glow-r.pulsing { animation-delay: 0.4s; }
  #glow-b.pulsing { animation-delay: 0.8s; }
  #glow-l.pulsing { animation-delay: 1.2s; }

  .logo-wrap:hover .arr-glow {
    animation: none;
    opacity: 1;
  }

  .wordmark {
    text-align: center;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .wordmark.show { opacity: 1; }
  .wordmark h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: #F0F0F0;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="logo-wrap">
  <svg id="logo" width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#181818"/>
        <stop offset="100%" stop-color="#0a0a0a"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="42%" cy="38%" r="58%">
        <stop offset="0%" stop-color="#1c1c1c"/>
        <stop offset="100%" stop-color="#0d0d0d"/>
      </radialGradient>
    </defs>

    <!-- OUTER BODY -->
    <circle cx="210" cy="210" r="200" fill="url(#bodyGrad)"/>
    <circle cx="210" cy="210" r="200" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    <circle cx="210" cy="210" r="196" fill="none" stroke="#1e1e1e" stroke-width="1"/>

    <!-- OUTER VINYL GROOVES -->
    <circle cx="210" cy="210" r="191" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
    <circle cx="210" cy="210" r="184" fill="none" stroke="#191919" stroke-width="1"/>
    <circle cx="210" cy="210" r="177" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
    <circle cx="210" cy="210" r="170" fill="none" stroke="#191919" stroke-width="1"/>
    <circle cx="210" cy="210" r="163" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
    <circle cx="210" cy="210" r="156" fill="none" stroke="#181818" stroke-width="1"/>
    <circle cx="210" cy="210" r="149" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
    <circle cx="210" cy="210" r="142" fill="none" stroke="#181818" stroke-width="1"/>

    <!-- INNER WHEEL RING -->
    <circle cx="210" cy="210" r="132" fill="#0b0b0b"/>
    <circle cx="210" cy="210" r="132" fill="none" stroke="#282828" stroke-width="1.2"/>
    <circle cx="210" cy="210" r="128" fill="none" stroke="#151515" stroke-width="0.7"/>

    <!-- CENTER VINYL — rotating -->
    <g id="vinyl-group">
      <circle cx="210" cy="210" r="88" fill="#0e0e0e"/>
      <circle cx="210" cy="210" r="88"  fill="none" stroke="#262626" stroke-width="1.2"/>
      <circle cx="210" cy="210" r="82"  fill="none" stroke="#1a1a1a" stroke-width="1"/>
      <circle cx="210" cy="210" r="76"  fill="none" stroke="#161616" stroke-width="0.9"/>
      <circle cx="210" cy="210" r="70"  fill="none" stroke="#1a1a1a" stroke-width="1"/>
      <circle cx="210" cy="210" r="64"  fill="none" stroke="#161616" stroke-width="0.9"/>
      <circle cx="210" cy="210" r="58"  fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
      <!-- Label -->
      <circle cx="210" cy="210" r="50" fill="url(#centerGrad)"/>
      <circle cx="210" cy="210" r="50"  fill="none" stroke="#232323" stroke-width="1"/>
      <circle cx="210" cy="210" r="43"  fill="none" stroke="#191919" stroke-width="0.6"/>
      <circle cx="210" cy="210" r="37"  fill="none" stroke="#1e1e1e" stroke-width="0.6"/>
      <!-- Off-center dot so rotation is visible -->
      <circle cx="210" cy="172" r="2.5" fill="#2e2e2e"/>
      <!-- Spindle -->
      <circle cx="210" cy="210" r="6.5" fill="#060606"/>
      <circle cx="210" cy="210" r="6.5" fill="none" stroke="#303030" stroke-width="1.2"/>
      <circle cx="210" cy="210" r="3"   fill="#040404"/>
    </g>

    <!-- ARROWS — base dim layer -->
    <polyline class="arr-base" points="200,106 210,96 220,106"/>
    <polyline class="arr-base" points="200,314 210,324 220,314"/>
    <polyline class="arr-base" points="106,200 96,210 106,220"/>
    <polyline class="arr-base" points="314,200 324,210 314,220"/>

    <!-- ARROWS — yellow-green glow layer on top -->
    <polyline id="glow-t" class="arr-glow" points="200,106 210,96 220,106"/>
    <polyline id="glow-b" class="arr-glow" points="200,314 210,324 220,314"/>
    <polyline id="glow-l" class="arr-glow" points="106,200 96,210 106,220"/>
    <polyline id="glow-r" class="arr-glow" points="314,200 324,210 314,220"/>

  </svg>

  <div class="wordmark" id="wordmark">
    <h1>Audiobaaz</h1>
  </div>
</div>

<script>
  const vinyl    = document.getElementById('vinyl-group');
  const wordmark = document.getElementById('wordmark');
  const glows    = ['glow-t', 'glow-r', 'glow-b', 'glow-l'].map(id => document.getElementById(id));

  function startVinyl() {
    vinyl.style.animationPlayState = 'running';
  }
  function startPulse() {
    glows.forEach(el => el.classList.add('pulsing'));
  }

  function runIntro() {
    setTimeout(() => {
      startVinyl();
      wordmark.classList.add('show');
    }, 600);
    setTimeout(startPulse, 1000);
  }

  window.addEventListener('load', runIntro);
</script>
</body>
</html>
